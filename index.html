<!-- Files are loaded by the script at the bottom, always checking GitHub for a newer copy, so nobody needs to clear their cache after an update -->
<style>html.booting body{visibility:hidden}</style>
<script>document.documentElement.classList.add('booting');</script>
<script>
  // Apply the saved (or system) theme before the page paints, so there's no flash
  (function () { var t; try { t = localStorage.getItem('bg:theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="/" data-view="tonight"><span id="burrito"></span><span>BURRITO GANG</span><small>game night</small></a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
    <div class="navwrap" id="navwrap">
    <nav class="tabs">
      <a href="/" data-view="tonight">Tonight</a>
      <a href="/" data-view="shuffle">Shuffle</a>
      <a href="/" data-view="discovery">Discovery</a>
      <a href="/" data-view="pitches">Pitches</a>
      <a href="/" data-view="news">News</a>
      <a href="/" data-view="leaderboard">Leaderboard</a>
    </nav>
    <div class="hdr-tools">
      <button class="theme-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      <div class="cur" id="cur" aria-label="Currency"></div>
    </div>
    </div>
    <div class="bellwrap" id="bellwrap">
      <button class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" title="Notifications">🔔<span class="badge" id="bellBadge" hidden></span></button>
      <div class="notif-panel" id="notifPanel" hidden></div>
    </div>
    <div class="me" id="me"></div>
  </div>
</header>
<div class="mockbar">PROTOTYPE · FAKE DATA · STEAM &amp; DISCORD NOT CONNECTED YET</div>

<main class="wrap">
  <div id="notice" hidden></div>
  <section class="crew-panel" id="crewPanel">
    <div class="label">Who's on tonight?</div>
    <div class="crew" id="crew"></div>
    <div class="crew-actions">
      <button class="linkbtn" data-crew="all">Everyone</button>
      <button class="linkbtn" data-crew="core">Just the 3 of us</button>
      <button class="linkbtn" data-crew="none">Clear</button>
    </div>
  </section>
  <section id="view"></section>
</main>

<div class="awning"></div>
<footer>burrito gang · gaymers.burritogang.com · keyshop prices via <a href="https://gg.deals" target="_blank" rel="noopener">GG.deals</a> · <button class="linkbtn" id="catToggle">🐈 cats: on</button></footer>
<div id="cats" aria-hidden="true"></div>

<div id="toast" role="status"></div>
<div id="modal" hidden></div>

<script>
(async () => {
  // A new address every minute (?v=…) so neither the browser nor GitHub's servers can hand over an old copy:
  // an update shows up within a minute of GitHub finishing its deploy.
  const v = Math.floor(Date.now() / 60000);
  const get = f => fetch(f + '?v=' + v, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.text(); });
  const show = () => document.documentElement.classList.remove('booting');
  try {
    const [css, ...js] = await Promise.all(['css/style.css', 'js/config.js', 'js/data.js', 'js/api.js', 'js/app.js', 'js/cats.js'].map(get));
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    show();
    const names = ['config', 'data', 'api', 'app', 'cats'];
    js.forEach((code, i) => { const sc = document.createElement('script'); sc.textContent = code + '\n//# sourceURL=js/' + names[i] + '.js'; document.body.appendChild(sc); });
  } catch (e) {
    show();
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:20px;font:16px sans-serif">Couldn’t load the site (' + e.message + '). Refresh to try again.</p>');
  }
})();
</script>
</body>
</html>
